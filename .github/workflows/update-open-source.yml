name: Update Open Source Stats

on:
  schedule:
    # Every day at 05:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Open Source Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          USERNAME = "Vex-15"
          TOKEN = os.environ["GH_TOKEN"]

          query = """
          query($login: String!, $cursor: String) {
            user(login: $login) {
              pullRequests(
                first: 100
                after: $cursor
                orderBy: {field: CREATED_AT, direction: DESC}
              ) {
                nodes {
                  repository {
                    name
                    nameWithOwner
                    url
                  }
                  mergedAt
                }

                pageInfo {
                  hasNextPage
                  endCursor
                }

                totalCount
              }
            }
          }
          """

          prs = []
          cursor = None
          total_count = 0

          # Fetch ALL PRs
          while True:

              payload = json.dumps({
                  "query": query,
                  "variables": {
                      "login": USERNAME,
                      "cursor": cursor
                  }
              }).encode()

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "Vex-15-open-source-stats"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              if "errors" in data:
                  raise RuntimeError(data["errors"])

              connection = data["data"]["user"]["pullRequests"]

              if total_count == 0:
                  total_count = connection["totalCount"]

              prs.extend(connection["nodes"])

              if not connection["pageInfo"]["hasNextPage"]:
                  break

              cursor = connection["pageInfo"]["endCursor"]

          print(f"Total PRs found: {total_count}")

          # Group PRs by repository
          repos = {}

          for pr in prs:

              repository = pr["repository"]
              repo_name = repository["nameWithOwner"]

              if repo_name not in repos:
                  repos[repo_name] = {
                      "name": repository["name"],
                      "nameWithOwner": repository["nameWithOwner"],
                      "url": repository["url"],
                      "prs": 0,
                      "merged": 0
                  }

              repos[repo_name]["prs"] += 1

              if pr["mergedAt"]:
                  repos[repo_name]["merged"] += 1

          # Total merged PRs
          total_merged = sum(
              repo["merged"]
              for repo in repos.values()
          )

          print(f"Total merged PRs: {total_merged}")
          print(f"Repositories: {len(repos)}")

          # Sort repositories
          sorted_repos = sorted(
              repos.values(),
              key=lambda repo: (
                  repo["prs"],
                  repo["merged"]
              ),
              reverse=True
          )

          # Create badges directory
          os.makedirs("badges", exist_ok=True)

          # Pull Requests badge
          with open("badges/prs.json", "w") as f:
              json.dump({
                  "schemaVersion": 1,
                  "label": "Pull Requests",
                  "message": str(total_count),
                  "color": "58A6FF"
              }, f, indent=2)

          # Merged PRs badge
          with open("badges/merged-prs.json", "w") as f:
              json.dump({
                  "schemaVersion": 1,
                  "label": "Merged PRs",
                  "message": str(total_merged),
                  "color": "58A6FF"
              }, f, indent=2)

          # Generate README section
          start_marker = "<!-- OPEN_SOURCE_STATS:START -->"
          end_marker = "<!-- OPEN_SOURCE_STATS:END -->"

          table = [
              start_marker,
              "",
              "### Repository Contributions",
              "",
              "| Repository | PRs | Merged |",
              "|:---|---:|---:|"
          ]

          if sorted_repos:

              for repo in sorted_repos:

                  table.append(
                      f'| [{repo["nameWithOwner"]}]({repo["url"]}) '
                      f'| {repo["prs"]} '
                      f'| {repo["merged"]} |'
                  )

          else:

              table.append(
                  "| No contributions yet | — | — |"
              )

          table.extend([
              "",
              end_marker
          ])

          generated_section = "\n".join(table)

          # Read README
          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          if start_marker not in readme:
              raise RuntimeError(
                  "OPEN_SOURCE_STATS:START marker not found"
              )

          if end_marker not in readme:
              raise RuntimeError(
                  "OPEN_SOURCE_STATS:END marker not found"
              )

          # Replace only generated section
          start_index = readme.index(start_marker)
          end_index = readme.index(end_marker) + len(end_marker)

          updated_readme = (
              readme[:start_index]
              + generated_section
              + readme[end_index:]
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_readme)

          print("README updated successfully.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md badges/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update open source stats"
            git push
          fi
