name: Update Open Source Stats

on:
  schedule:
    - cron: "0 0 * * *" # 05:30 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Open Source Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          USERNAME = "Vex-15"
          TOKEN = os.environ["GH_TOKEN"]

          # Repositories we DON'T want to show
          EXCLUDED_OWNERS = {
              "Vex-15",
              "Arnav-Shende007",
              "meshery"
          }

          query = """
          query($login: String!, $cursor: String) {
            user(login: $login) {
              pullRequests(
                first: 100
                after: $cursor
                orderBy: {field: CREATED_AT, direction: DESC}
              ) {
                nodes {
                  repository {
                    name
                    nameWithOwner
                    url
                    owner {
                      login
                    }
                  }
                  mergedAt
                }

                pageInfo {
                  hasNextPage
                  endCursor
                }

                totalCount
              }
            }
          }
          """

          prs = []
          cursor = None

          while True:

              payload = json.dumps({
                  "query": query,
                  "variables": {
                      "login": USERNAME,
                      "cursor": cursor
                  }
              }).encode()

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "Vex-15-open-source-stats"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              if "errors" in data:
                  raise RuntimeError(data["errors"])

              connection = data["data"]["user"]["pullRequests"]

              prs.extend(connection["nodes"])

              if not connection["pageInfo"]["hasNextPage"]:
                  break

              cursor = connection["pageInfo"]["endCursor"]

          # ----------------------------------------
          # Filter repositories
          # ----------------------------------------

          filtered_prs = []

          for pr in prs:

              owner = pr["repository"]["owner"]["login"]

              if owner in EXCLUDED_OWNERS:
                  continue

              filtered_prs.append(pr)

          # ----------------------------------------
          # Group by repository
          # ----------------------------------------

          repos = {}

          for pr in filtered_prs:

              repository = pr["repository"]
              repo_name = repository["nameWithOwner"]

              if repo_name not in repos:

                  repos[repo_name] = {
                      "nameWithOwner": repo_name,
                      "url": repository["url"],
                      "prs": 0,
                      "merged": 0
                  }

              repos[repo_name]["prs"] += 1

              if pr["mergedAt"]:
                  repos[repo_name]["merged"] += 1

          # ----------------------------------------
          # Totals
          # ----------------------------------------

          total_prs = len(filtered_prs)

          total_merged = sum(
              repo["merged"]
              for repo in repos.values()
          )

          print("--------------------------------")
          print("Open Source Statistics")
          print("--------------------------------")
          print(f"Total PRs: {total_prs}")
          print(f"Merged PRs: {total_merged}")
          print(f"Repositories: {len(repos)}")
          print("--------------------------------")

          for repo in repos.values():
              print(
                  f'{repo["nameWithOwner"]}: '
                  f'{repo["prs"]} PRs / '
                  f'{repo["merged"]} merged'
              )

          # ----------------------------------------
          # Sort repositories
          # ----------------------------------------

          sorted_repos = sorted(
              repos.values(),
              key=lambda repo: (
                  repo["merged"],
                  repo["prs"]
              ),
              reverse=True
          )

          # ----------------------------------------
          # Generate badges
          # ----------------------------------------

          os.makedirs("badges", exist_ok=True)

          with open("badges/prs.json", "w") as f:

              json.dump(
                  {
                      "schemaVersion": 1,
                      "label": "Pull Requests",
                      "message": str(total_prs),
                      "color": "58A6FF"
                  },
                  f,
                  indent=2
              )

          with open("badges/merged-prs.json", "w") as f:

              json.dump(
                  {
                      "schemaVersion": 1,
                      "label": "Merged PRs",
                      "message": str(total_merged),
                      "color": "58A6FF"
                  },
                  f,
                  indent=2
              )

          # ----------------------------------------
          # Generate README table
          # ----------------------------------------

          START = "<!-- OPEN_SOURCE_STATS:START -->"
          END = "<!-- OPEN_SOURCE_STATS:END -->"

          table = [
              START,
              "",
              "### Repository Contributions",
              "",
              "| Repository | PRs | Merged |",
              "|:---|---:|---:|"
          ]

          if sorted_repos:

              for repo in sorted_repos:

                  table.append(
                      f'| [{repo["nameWithOwner"]}]({repo["url"]}) '
                      f'| {repo["prs"]} '
                      f'| {repo["merged"]} |'
                  )

          else:

              table.append(
                  "| No external contributions yet | — | — |"
              )

          table.extend([
              "",
              END
          ])

          generated_section = "\n".join(table)

          # ----------------------------------------
          # Update README
          # ----------------------------------------

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          if START not in readme:
              raise RuntimeError(
                  "OPEN_SOURCE_STATS:START marker not found"
              )

          if END not in readme:
              raise RuntimeError(
                  "OPEN_SOURCE_STATS:END marker not found"
              )

          start_index = readme.index(START)
          end_index = readme.index(END) + len(END)

          updated_readme = (
              readme[:start_index]
              + generated_section
              + readme[end_index:]
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_readme)

          print("README updated successfully.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md badges/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update open source stats"
            git push
          fi
