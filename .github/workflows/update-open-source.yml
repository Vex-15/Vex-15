name: Update Open Source Stats

on:
  schedule:
    # Every day at 00:00 UTC = 05:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Open Source Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          USERNAME = "Vex-15"
          TOKEN = os.environ["GH_TOKEN"]

          # ============================================================
          # EXCLUDED REPOSITORY OWNERS
          # ============================================================
          # Only repositories owned by these two users are excluded.
          # All other repositories are included.
          # ============================================================

          EXCLUDED_OWNERS = {
              "Vex-15",
              "Arnav-Shende007"
          }

          # ============================================================
          # GITHUB GRAPHQL QUERY
          # ============================================================

          query = """
          query($login: String!, $cursor: String) {
            user(login: $login) {
              pullRequests(
                first: 100
                after: $cursor
                orderBy: {field: CREATED_AT, direction: DESC}
              ) {
                nodes {
                  repository {
                    name
                    nameWithOwner
                    url
                    owner {
                      login
                    }
                  }
                  mergedAt
                }

                pageInfo {
                  hasNextPage
                  endCursor
                }

                totalCount
              }
            }
          }
          """

          # ============================================================
          # FETCH ALL PULL REQUESTS
          # ============================================================

          prs = []
          cursor = None
          total_github_prs = 0

          while True:

              payload = json.dumps({
                  "query": query,
                  "variables": {
                      "login": USERNAME,
                      "cursor": cursor
                  }
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "Vex-15-open-source-stats"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              # Check for GraphQL errors
              if "errors" in data:
                  raise RuntimeError(
                      json.dumps(data["errors"], indent=2)
                  )

              connection = data["data"]["user"]["pullRequests"]

              if total_github_prs == 0:
                  total_github_prs = connection["totalCount"]

              prs.extend(connection["nodes"])

              # Stop when all pages are fetched
              if not connection["pageInfo"]["hasNextPage"]:
                  break

              cursor = connection["pageInfo"]["endCursor"]

          print("========================================")
          print("GitHub PR Statistics")
          print("========================================")
          print(f"Total GitHub PRs: {total_github_prs}")
          print(f"PRs fetched: {len(prs)}")
          print("========================================")

          # ============================================================
          # FILTER PRs
          # ============================================================

          filtered_prs = []

          for pr in prs:

              repository = pr["repository"]
              owner = repository["owner"]["login"]

              if owner in EXCLUDED_OWNERS:

                  print(
                      f'Excluded: {repository["nameWithOwner"]}'
                  )

                  continue

              filtered_prs.append(pr)

          # ============================================================
          # GROUP PRs BY REPOSITORY
          # ============================================================

          repos = {}

          for pr in filtered_prs:

              repository = pr["repository"]
              repo_name = repository["nameWithOwner"]

              if repo_name not in repos:

                  repos[repo_name] = {
                      "nameWithOwner": repo_name,
                      "url": repository["url"],
                      "prs": 0,
                      "merged": 0
                  }

              repos[repo_name]["prs"] += 1

              if pr["mergedAt"] is not None:
                  repos[repo_name]["merged"] += 1

          # ============================================================
          # CALCULATE TOTALS
          # ============================================================

          total_prs = len(filtered_prs)

          total_merged = sum(
              repo["merged"]
              for repo in repos.values()
          )

          print("")
          print("========================================")
          print("OPEN SOURCE STATISTICS")
          print("========================================")
          print(f"Total external PRs: {total_prs}")
          print(f"Total merged PRs: {total_merged}")
          print(f"Repositories: {len(repos)}")
          print("========================================")

          # ============================================================
          # PRINT REPOSITORY STATISTICS
          # ============================================================

          for repo in repos.values():

              print(
                  f'{repo["nameWithOwner"]}: '
                  f'{repo["prs"]} PRs / '
                  f'{repo["merged"]} merged'
              )

          # ============================================================
          # SORT REPOSITORIES
          # ============================================================
          # Merged PRs first, then total PRs.
          # ============================================================

          sorted_repos = sorted(
              repos.values(),
              key=lambda repo: (
                  repo["merged"],
                  repo["prs"]
              ),
              reverse=True
          )

          # ============================================================
          # CREATE BADGES DIRECTORY
          # ============================================================

          os.makedirs("badges", exist_ok=True)

          # ============================================================
          # GENERATE TOTAL PR BADGE
          # ============================================================

          with open(
              "badges/prs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "schemaVersion": 1,
                      "label": "Pull Requests",
                      "message": str(total_prs),
                      "color": "58A6FF"
                  },
                  f,
                  indent=2
              )

          # ============================================================
          # GENERATE MERGED PR BADGE
          # ============================================================

          with open(
              "badges/merged-prs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "schemaVersion": 1,
                      "label": "Merged PRs",
                      "message": str(total_merged),
                      "color": "58A6FF"
                  },
                  f,
                  indent=2
              )

          # ============================================================
          # README MARKERS
          # ============================================================

          START = "<!-- OPEN_SOURCE_STATS:START -->"
          END = "<!-- OPEN_SOURCE_STATS:END -->"

          # ============================================================
          # GENERATE README TABLE
          # ============================================================

          table = [
              START,
              "",
              "### Repository Contributions",
              "",
              "| Repository | PRs | Merged |",
              "|:---|---:|---:|"
          ]

          if sorted_repos:

              for repo in sorted_repos:

                  table.append(
                      f'| '
                      f'[{repo["nameWithOwner"]}]'
                      f'({repo["url"]}) '
                      f'| {repo["prs"]} '
                      f'| {repo["merged"]} |'
                  )

          else:

              table.append(
                  "| No external contributions yet | — | — |"
              )

          table.extend([
              "",
              END
          ])

          generated_section = "\n".join(table)

          # ============================================================
          # READ README
          # ============================================================

          with open(
              "README.md",
              "r",
              encoding="utf-8"
          ) as f:

              readme = f.read()

          # ============================================================
          # CHECK README MARKERS
          # ============================================================

          if START not in readme:

              raise RuntimeError(
                  "OPEN_SOURCE_STATS:START marker "
                  "not found in README.md"
              )

          if END not in readme:

              raise RuntimeError(
                  "OPEN_SOURCE_STATS:END marker "
                  "not found in README.md"
              )

          # ============================================================
          # REPLACE ONLY THE GENERATED SECTION
          # ============================================================

          start_index = readme.index(START)

          end_index = (
              readme.index(END)
              + len(END)
          )

          updated_readme = (
              readme[:start_index]
              + generated_section
              + readme[end_index:]
          )

          # ============================================================
          # WRITE UPDATED README
          # ============================================================

          with open(
              "README.md",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(updated_readme)

          print("")
          print("README updated successfully.")
          print("========================================")
          PY

      # ================================================================
      # COMMIT CHANGES
      # ================================================================

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md badges/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update open source stats"
            git push
          fi
